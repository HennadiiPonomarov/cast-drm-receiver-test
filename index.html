<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SWEET Cast Lab Receiver</title>
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      cast-media-player {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        --background: #000;
        --background-color: #000;
        --background-image: none;
        /* CAF shows this mark only in its controls/idle UI, never over video. */
        --logo-background: transparent;
        --logo-color: transparent;
        --logo-image: url('assets/sweet-tv-logo-light.svg');
        --logo-size: 360px auto;
        --splash-background: #000;
        --splash-color: #000;
        --splash-image: url('assets/sweet-tv-logo-light.svg');
        --splash-size: 360px auto;
        --font-family: Arial, sans-serif;
        --theme-hue: 185;
        --progress-color: #20c5c9;
      }

      #receiver-loader {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 38px;
        background: #000;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 180ms ease, visibility 180ms ease;
      }

      #receiver-loader.visible {
        opacity: 1;
        visibility: visible;
      }

      #receiver-loader-logo {
        width: min(340px, 42vw);
        height: auto;
      }

      .receiver-loader-spinner {
        width: 54px;
        height: 54px;
        box-sizing: border-box;
        border: 4px solid rgba(32, 197, 201, 0.22);
        border-top-color: #20c5c9;
        border-radius: 50%;
        animation: sweet-loader-spin 820ms linear infinite;
      }

      #receiver-loader-label {
        min-height: 28px;
        color: #a9bcc4;
        font-size: 21px;
        font-weight: 500;
        line-height: 1.3;
      }

      @keyframes sweet-loader-spin {
        to { transform: rotate(360deg); }
      }

      #receiver-status {
        position: fixed;
        right: 4vw;
        bottom: 4vh;
        max-width: 62vw;
        padding: 0.7em 1em;
        border-radius: 6px;
        background: rgba(13, 24, 32, 0.86);
        color: #f4f8fa;
        font: 500 22px/1.3 Arial, sans-serif;
        opacity: 0;
        transition: opacity 180ms ease;
        pointer-events: none;
        z-index: 10;
      }

      #receiver-status.visible {
        opacity: 1;
      }
    </style>
    <script defer src="receiver.js?v=receiver-i18n-1"></script>
  </head>
  <body>
    <cast-media-player></cast-media-player>
    <div id="receiver-loader" class="visible" aria-hidden="true">
      <img id="receiver-loader-logo" src="assets/sweet-tv-logo-light.svg" alt="SWEET.TV">
      <div class="receiver-loader-spinner"></div>
      <div id="receiver-loader-label"></div>
    </div>
    <div id="receiver-status" role="status" aria-live="polite"></div>
  </body>
</html>
