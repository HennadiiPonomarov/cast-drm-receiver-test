<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SWEET Cast Lab Receiver</title>
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <style>
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('assets/fonts/inter-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
          U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
          U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('assets/fonts/inter-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7,
          U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F,
          U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F,
          U+A720-A7FF;
      }

      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('assets/fonts/inter-cyrillic.woff2') format('woff2');
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }

      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('assets/fonts/inter-greek.woff2') format('woff2');
        unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1,
          U+03A3-03FF;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: 'Inter', Arial, sans-serif;
      }

      cast-media-player {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: #000;
        --background: #000;
        --background-color: #000;
        --background-image: none;
        --logo-background: transparent;
        --logo-color: transparent;
        --logo-image: url('assets/transparent.svg');
        --logo-size: 1px 1px;
        --splash-background: #000;
        --splash-color: #000;
        --splash-image: url('assets/transparent.svg');
        --splash-size: 1px 1px;
        --font-family: 'Inter', Arial, sans-serif;
        --theme-hue: 185;
        --progress-color: transparent;
        --break-color: transparent;
        --spinner-image: none;
        --buffering-image: none;
        --next-preview-visibility: hidden;
      }

      #receiver-loader {
        position: fixed;
        inset: 0;
        z-index: 20;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        will-change: opacity;
        transition: opacity 460ms cubic-bezier(0.22, 1, 0.36, 1),
          visibility 0s linear 460ms;
      }

      #receiver-loader.visible {
        opacity: 1;
        visibility: visible;
        transition-delay: 0s;
      }

      #receiver-loader-logo,
      #receiver-idle-logo {
        position: absolute;
        top: 5vh;
        left: 5vw;
        width: min(152px, 20vw);
        height: auto;
        transform: translateY(0);
      }

      #receiver-loader-activity {
        position: absolute;
        top: 50%;
        left: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0;
        max-width: 76vw;
        transform: translate(-50%, -50%);
      }

      .receiver-loader-spinner {
        width: 28px;
        height: 28px;
        box-sizing: border-box;
        border: 3px solid rgba(32, 197, 201, 0.25);
        border-top-color: #20c5c9;
        border-radius: 50%;
        animation: sweet-loader-spin 820ms linear infinite;
      }

      @keyframes sweet-loader-spin {
        to { transform: rotate(360deg); }
      }

      #receiver-idle {
        position: fixed;
        inset: 0;
        z-index: 15;
        background: #000;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        will-change: opacity;
        transition: opacity 560ms cubic-bezier(0.22, 1, 0.36, 1),
          visibility 0s linear 560ms;
      }

      #receiver-idle.visible {
        opacity: 1;
        visibility: visible;
        transition-delay: 0s;
      }

      #receiver-idle-content {
        position: absolute;
        top: 50%;
        left: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        transform: translate(-50%, -50%);
      }

      .receiver-idle-pulse {
        position: relative;
        width: 50px;
        height: 50px;
        border: 2px solid rgba(32, 197, 201, 0.72);
        border-radius: 50%;
        box-shadow: 0 0 28px rgba(32, 197, 201, 0.12);
      }

      .receiver-idle-pulse::before,
      .receiver-idle-pulse::after {
        content: '';
        position: absolute;
        inset: -2px;
        border: 2px solid rgba(32, 197, 201, 0.36);
        border-radius: 50%;
        animation: sweet-idle-pulse 2.8s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }

      .receiver-idle-pulse::after {
        animation-delay: 1.4s;
      }

      .receiver-idle-play {
        position: absolute;
        top: 50%;
        left: 52%;
        width: 0;
        height: 0;
        border-top: 8px solid transparent;
        border-bottom: 8px solid transparent;
        border-left: 13px solid #20c5c9;
        transform: translate(-50%, -50%);
      }

      #receiver-idle-label {
        margin: 0;
        color: rgba(244, 248, 250, 0.72);
        font: 500 18px/1.4 'Inter', Arial, sans-serif;
        letter-spacing: 0;
        white-space: nowrap;
      }

      @keyframes sweet-idle-pulse {
        0% {
          opacity: 0;
          transform: scale(0.9);
        }
        35% { opacity: 0.5; }
        100% {
          opacity: 0;
          transform: scale(1.75);
        }
      }

      #receiver-status {
        position: fixed;
        left: 50%;
        bottom: 10vh;
        max-width: min(680px, 72vw);
        padding: 0.75em 1.1em;
        border-left: 4px solid #20c5c9;
        border-radius: 4px;
        background: rgba(13, 24, 32, 0.94);
        color: #f4f8fa;
        font: 600 20px/1.3 'Inter', Arial, sans-serif;
        opacity: 0;
        transform: translate(-50%, 10px);
        transition: opacity 260ms cubic-bezier(0.22, 1, 0.36, 1),
          transform 260ms cubic-bezier(0.22, 1, 0.36, 1);
        pointer-events: none;
        z-index: 10;
      }

      #receiver-status.visible {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      #receiver-status.error {
        border-left-color: #ff6b6b;
      }

      .receiver-layer {
        position: fixed;
        inset: 0;
        z-index: 18;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 320ms cubic-bezier(0.22, 1, 0.36, 1),
          visibility 0s linear 320ms;
      }

      .receiver-layer.visible {
        opacity: 1;
        visibility: visible;
        transition-delay: 0s;
      }

      #receiver-transition {
        z-index: 22;
      }

      #receiver-transition-content {
        position: absolute;
        left: 5vw;
        bottom: 11vh;
        display: flex;
        align-items: center;
        min-width: min(500px, 62vw);
        max-width: 72vw;
        padding: 16px 20px 16px 16px;
        border-left: 4px solid #20c5c9;
        border-radius: 4px;
        background: rgba(7, 16, 21, 0.82);
        box-sizing: border-box;
        transform: translateY(14px);
        transition: transform 320ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      #receiver-transition.visible #receiver-transition-content {
        transform: translateY(0);
      }

      #receiver-transition-artwork {
        flex: 0 0 auto;
        width: 78px;
        height: 78px;
        margin-right: 18px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.08);
        object-fit: contain;
      }

      #receiver-transition-copy,
      #receiver-end-copy {
        min-width: 0;
      }

      #receiver-transition-title,
      #receiver-end-title {
        margin: 0;
        overflow: hidden;
        color: #f7fafb;
        font: 650 28px/1.18 'Inter', Arial, sans-serif;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #receiver-transition-meta,
      #receiver-end-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 8px;
        color: rgba(247, 250, 251, 0.72);
        font: 500 16px/1.3 'Inter', Arial, sans-serif;
      }

      .receiver-badge {
        display: inline-flex;
        align-items: center;
        min-height: 26px;
        padding: 0 9px;
        border-radius: 4px;
        background: #20c5c9;
        color: #071015;
        font: 750 13px/26px 'Inter', Arial, sans-serif;
        text-transform: uppercase;
      }

      #receiver-toast {
        position: fixed;
        left: 50%;
        bottom: 9vh;
        z-index: 30;
        display: flex;
        align-items: center;
        gap: 10px;
        max-width: 68vw;
        padding: 12px 16px;
        border-radius: 4px;
        background: rgba(7, 16, 21, 0.9);
        color: #f7fafb;
        font: 600 17px/1.3 'Inter', Arial, sans-serif;
        opacity: 0;
        visibility: hidden;
        transform: translate(-50%, 12px);
        transition: opacity 220ms cubic-bezier(0.22, 1, 0.36, 1),
          transform 220ms cubic-bezier(0.22, 1, 0.36, 1),
          visibility 0s linear 220ms;
        pointer-events: none;
      }

      #receiver-toast.visible {
        opacity: 1;
        visibility: visible;
        transform: translate(-50%, 0);
        transition-delay: 0s;
      }

      #receiver-toast-dot {
        width: 8px;
        height: 8px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: #20c5c9;
      }

      #receiver-pause {
        z-index: 19;
        background:
          linear-gradient(180deg, rgba(0, 0, 0, 0.62) 0, transparent 32%),
          linear-gradient(0deg, rgba(0, 0, 0, 0.82) 0, transparent 48%);
      }

      #receiver-pause-content {
        position: absolute;
        left: 5vw;
        right: 5vw;
        bottom: 5.5vh;
      }

      #receiver-pause-logo {
        position: absolute;
        top: 5vh;
        left: 5vw;
        width: min(152px, 20vw);
        height: auto;
      }

      #receiver-pause-heading {
        position: absolute;
        top: 5vh;
        left: 23vw;
        right: 23vw;
        text-align: center;
      }

      #receiver-pause-label {
        margin-top: 6px;
        color: rgba(247, 250, 251, 0.68);
        font: 500 15px/1.25 'Inter', Arial, sans-serif;
      }

      #receiver-pause-title {
        margin: 0;
        overflow: hidden;
        color: #f7fafb;
        font: 650 24px/1.2 'Inter', Arial, sans-serif;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #receiver-pause-meta {
        display: none;
      }

      #receiver-pause-timeline {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 16px;
      }

      #receiver-pause-progress {
        position: relative;
        width: 100%;
        height: 4px;
        background: rgba(255, 255, 255, 0.24);
      }

      #receiver-pause-progress::after {
        content: '';
        position: absolute;
        top: 50%;
        left: var(--progress, 0%);
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #20c5c9;
        box-shadow: 0 0 0 4px rgba(32, 197, 201, 0.16);
        transform: translate(-50%, -50%);
      }

      #receiver-pause-progress-fill {
        width: 0;
        height: 100%;
        background: #20c5c9;
        transition: width 180ms linear;
      }

      #receiver-pause-time,
      #receiver-pause-duration {
        min-width: 66px;
        color: #f7fafb;
        font: 600 14px/1.2 'Inter', Arial, sans-serif;
        white-space: nowrap;
      }

      #receiver-pause-duration {
        text-align: right;
      }

      #receiver-pause-actions {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-top: 22px;
      }

      .receiver-control {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 54px;
        height: 54px;
        border: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.14);
        box-sizing: border-box;
      }

      .receiver-control.primary {
        width: 62px;
        height: 62px;
        background: #20c5c9;
      }

      .receiver-control.option {
        width: auto;
        min-width: 84px;
        padding: 0 16px;
        border-radius: 27px;
        gap: 9px;
        color: #f7fafb;
        font: 600 14px/1 'Inter', Arial, sans-serif;
      }

      .receiver-control img {
        width: 25px;
        height: 25px;
        object-fit: contain;
      }

      .receiver-control.primary img {
        width: 29px;
        height: 29px;
        filter: brightness(0) saturate(100%);
      }

      #receiver-options {
        position: absolute;
        right: 5vw;
        bottom: 17vh;
        z-index: 34;
        width: min(360px, 42vw);
        max-height: 58vh;
        padding: 18px;
        overflow: hidden;
        border-radius: 4px;
        background: rgba(11, 20, 25, 0.96);
        opacity: 0;
        visibility: hidden;
        transform: translateY(12px);
        transition: opacity 180ms ease, transform 180ms ease,
          visibility 0s linear 180ms;
      }

      #receiver-options.visible {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
        transition-delay: 0s;
      }

      #receiver-options-title {
        margin: 0 0 12px;
        color: #f7fafb;
        font: 650 20px/1.2 'Inter', Arial, sans-serif;
      }

      #receiver-options-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .receiver-option-row {
        display: flex;
        align-items: center;
        min-height: 44px;
        padding: 0 12px;
        border-left: 3px solid transparent;
        color: rgba(247, 250, 251, 0.72);
        font: 550 15px/1.2 'Inter', Arial, sans-serif;
      }

      .receiver-option-row.selected {
        border-left-color: #20c5c9;
        background: rgba(32, 197, 201, 0.12);
        color: #20c5c9;
      }

      #receiver-seek-preview {
        position: fixed;
        left: 50%;
        bottom: 19vh;
        z-index: 32;
        display: flex;
        flex-direction: column;
        align-items: center;
        opacity: 0;
        visibility: hidden;
        transform: translate(-50%, 10px);
        transition: opacity 180ms ease, transform 180ms ease,
          visibility 0s linear 180ms;
        pointer-events: none;
      }

      #receiver-seek-preview.visible {
        opacity: 1;
        visibility: visible;
        transform: translate(-50%, 0);
        transition-delay: 0s;
      }

      #receiver-seek-frame {
        position: relative;
        width: 240px;
        height: 135px;
        overflow: hidden;
        border: 2px solid rgba(255, 255, 255, 0.86);
        border-radius: 4px;
        background: #071015;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.38);
      }

      #receiver-seek-frame[hidden] {
        display: none;
      }

      #receiver-seek-image {
        position: absolute;
        display: none;
        max-width: none;
        transform-origin: top left;
      }

      #receiver-seek-time {
        min-width: 76px;
        margin-top: 8px;
        padding: 6px 10px;
        border-radius: 4px;
        background: rgba(7, 16, 21, 0.9);
        color: #fff;
        font: 650 15px/1.2 'Inter', Arial, sans-serif;
        text-align: center;
      }

      #receiver-error,
      #receiver-end {
        z-index: 35;
        background: #000;
      }

      #receiver-error-content,
      #receiver-end-content {
        position: absolute;
        top: 50%;
        left: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(720px, 78vw);
        text-align: center;
        transform: translate(-50%, -50%);
      }

      #receiver-error-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 54px;
        height: 54px;
        margin-bottom: 22px;
        border: 2px solid #ff6b6b;
        border-radius: 50%;
        color: #ff6b6b;
        font: 750 30px/1 'Inter', Arial, sans-serif;
      }

      #receiver-error-title {
        margin: 0;
        color: #f7fafb;
        font: 650 30px/1.2 'Inter', Arial, sans-serif;
      }

      #receiver-error-message {
        margin: 10px 0 0;
        color: rgba(247, 250, 251, 0.68);
        font: 450 18px/1.45 'Inter', Arial, sans-serif;
      }

      #receiver-error-code {
        margin-top: 20px;
        color: rgba(247, 250, 251, 0.42);
        font: 500 13px/1.2 'Inter', Arial, sans-serif;
      }

      #receiver-end-artwork {
        width: 152px;
        height: 152px;
        margin-bottom: 24px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.06);
        object-fit: contain;
      }

      #receiver-end-meta {
        justify-content: center;
      }

      @media (max-width: 960px), (max-height: 600px) {
        #receiver-transition-title,
        #receiver-end-title {
          font-size: 24px;
        }

        #receiver-pause-title {
          font-size: 20px;
        }

        #receiver-transition-artwork {
          width: 64px;
          height: 64px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 1ms !important;
          transition-duration: 1ms !important;
        }
      }

    </style>
    <script defer src="receiver.js?v=receiver-smarttv-ui-6"></script>
  </head>
  <body>
    <cast-media-player id="receiver-player"></cast-media-player>
    <div id="receiver-idle" class="visible" aria-hidden="true">
      <img id="receiver-idle-logo" src="assets/sweet-tv-logo-light.svg" alt="SWEET.TV">
      <div id="receiver-idle-content">
        <div class="receiver-idle-pulse">
          <span class="receiver-idle-play"></span>
        </div>
        <p id="receiver-idle-label"></p>
      </div>
    </div>
    <div id="receiver-loader" class="visible" aria-hidden="true">
      <img id="receiver-loader-logo" src="assets/sweet-tv-logo-light.svg" alt="SWEET.TV">
      <div id="receiver-loader-activity">
        <div class="receiver-loader-spinner"></div>
      </div>
    </div>
    <div id="receiver-transition" class="receiver-layer" aria-hidden="true">
      <div id="receiver-transition-content">
        <img id="receiver-transition-artwork" alt="">
        <div id="receiver-transition-copy">
          <h1 id="receiver-transition-title"></h1>
          <div id="receiver-transition-meta">
            <span id="receiver-transition-badge" class="receiver-badge"></span>
            <span id="receiver-transition-subtitle"></span>
          </div>
        </div>
      </div>
    </div>
    <div id="receiver-toast" role="status" aria-live="polite">
      <span id="receiver-toast-dot"></span>
      <span id="receiver-toast-label"></span>
    </div>
    <div id="receiver-pause" class="receiver-layer" aria-hidden="true">
      <img id="receiver-pause-logo" src="assets/sweet-tv-logo-light.svg" alt="SWEET.TV">
      <div id="receiver-pause-heading">
        <h1 id="receiver-pause-title"></h1>
        <div id="receiver-pause-label"></div>
        <div id="receiver-pause-meta"></div>
      </div>
      <div id="receiver-pause-content">
        <div id="receiver-pause-timeline">
          <div id="receiver-pause-time"></div>
          <div id="receiver-pause-progress">
            <div id="receiver-pause-progress-fill"></div>
          </div>
          <div id="receiver-pause-duration"></div>
        </div>
        <div id="receiver-pause-actions">
          <div class="receiver-control"><img src="assets/player/rewind-left.svg" alt=""></div>
          <div class="receiver-control primary">
            <img id="receiver-play-state-icon" src="assets/player/pause.svg" alt="">
          </div>
          <div class="receiver-control"><img src="assets/player/rewind-right.svg" alt=""></div>
          <div class="receiver-control option">
            <img src="assets/player/audio.svg" alt="">
            <span id="receiver-audio-label"></span>
          </div>
          <div class="receiver-control option">
            <img src="assets/player/hamburger.svg" alt="">
            <span id="receiver-subtitles-label"></span>
          </div>
          <div class="receiver-control option">
            <img src="assets/player/auto.svg" alt="">
            <span id="receiver-quality-label"></span>
          </div>
        </div>
      </div>
    </div>
    <div id="receiver-options" aria-hidden="true">
      <h2 id="receiver-options-title"></h2>
      <div id="receiver-options-list"></div>
    </div>
    <div id="receiver-seek-preview" aria-hidden="true">
      <div id="receiver-seek-frame">
        <img id="receiver-seek-image" alt="">
      </div>
      <div id="receiver-seek-time"></div>
    </div>
    <div id="receiver-error" class="receiver-layer" aria-hidden="true">
      <div id="receiver-error-content">
        <div id="receiver-error-icon">!</div>
        <h1 id="receiver-error-title"></h1>
        <p id="receiver-error-message"></p>
        <div id="receiver-error-code"></div>
      </div>
    </div>
    <div id="receiver-end" class="receiver-layer" aria-hidden="true">
      <div id="receiver-end-content">
        <img id="receiver-end-artwork" alt="">
        <div id="receiver-end-copy">
          <h1 id="receiver-end-title"></h1>
          <div id="receiver-end-meta"></div>
        </div>
      </div>
    </div>
    <div id="receiver-status" role="status" aria-live="polite"></div>
  </body>
</html>
