<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SWEET Cast Lab Receiver</title>
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <style>
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('assets/fonts/inter-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
          U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
          U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('assets/fonts/inter-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7,
          U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F,
          U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F,
          U+A720-A7FF;
      }

      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('assets/fonts/inter-cyrillic.woff2') format('woff2');
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }

      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('assets/fonts/inter-greek.woff2') format('woff2');
        unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1,
          U+03A3-03FF;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: 'Inter', Arial, sans-serif;
      }

      cast-media-player {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: #000;
        --background: #000;
        --background-color: #000;
        --background-image: none;
        --logo-background: transparent;
        --logo-color: transparent;
        --logo-image: url('assets/transparent.svg');
        --logo-size: 1px 1px;
        --splash-background: #000;
        --splash-color: #000;
        --splash-image: url('assets/transparent.svg');
        --splash-size: 1px 1px;
        --font-family: 'Inter', Arial, sans-serif;
        --theme-hue: 185;
        --progress-color: transparent;
        --break-color: transparent;
        --spinner-image: none;
        --buffering-image: none;
        --next-preview-visibility: hidden;
      }

      #receiver-loader {
        position: fixed;
        inset: 0;
        z-index: 20;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        background:
          radial-gradient(circle at 50% 50%, rgba(7, 22, 27, 0.18), transparent 32%),
          rgba(0, 0, 0, 0.36);
        will-change: opacity;
        transition: opacity 460ms cubic-bezier(0.22, 1, 0.36, 1),
          visibility 0s linear 460ms;
      }

      #receiver-loader.visible {
        opacity: 1;
        visibility: visible;
        transition-delay: 0s;
      }

      #receiver-loader-logo,
      #receiver-idle-logo,
      #receiver-end-logo {
        position: absolute;
        top: 5vh;
        left: 5vw;
        width: min(152px, 20vw);
        height: auto;
        transform: translateY(0);
      }

      #receiver-loader-activity {
        position: absolute;
        top: 50%;
        left: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0;
        max-width: 76vw;
        transform: translate(-50%, -50%);
      }

      .receiver-loader-spinner {
        width: 28px;
        height: 28px;
        box-sizing: border-box;
        border: 3px solid rgba(32, 197, 201, 0.25);
        border-top-color: #20c5c9;
        border-radius: 50%;
        animation: sweet-loader-spin 820ms linear infinite;
      }

      @keyframes sweet-loader-spin {
        to { transform: rotate(360deg); }
      }

      #receiver-idle {
        position: fixed;
        inset: 0;
        z-index: 15;
        background: #000;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        will-change: opacity;
        transition: opacity 560ms cubic-bezier(0.22, 1, 0.36, 1),
          visibility 0s linear 560ms;
      }

      #receiver-idle.visible {
        opacity: 1;
        visibility: visible;
        transition-delay: 0s;
      }

      #receiver-idle-content {
        position: absolute;
        top: 50%;
        left: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        transform: translate(-50%, -50%);
      }

      .receiver-idle-pulse {
        position: relative;
        width: 50px;
        height: 50px;
        border: 2px solid rgba(32, 197, 201, 0.72);
        border-radius: 50%;
        box-shadow: 0 0 28px rgba(32, 197, 201, 0.12);
      }

      .receiver-idle-pulse::before,
      .receiver-idle-pulse::after {
        content: '';
        position: absolute;
        inset: -2px;
        border: 2px solid rgba(32, 197, 201, 0.36);
        border-radius: 50%;
        animation: sweet-idle-pulse 2.8s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }

      .receiver-idle-pulse::after {
        animation-delay: 1.4s;
      }

      .receiver-idle-play {
        position: absolute;
        top: 50%;
        left: 52%;
        width: 0;
        height: 0;
        border-top: 8px solid transparent;
        border-bottom: 8px solid transparent;
        border-left: 13px solid #20c5c9;
        transform: translate(-50%, -50%);
      }

      #receiver-idle-label {
        margin: 0;
        color: rgba(244, 248, 250, 0.72);
        font: 500 18px/1.4 'Inter', Arial, sans-serif;
        letter-spacing: 0;
        white-space: nowrap;
      }

      @keyframes sweet-idle-pulse {
        0% {
          opacity: 0;
          transform: scale(0.9);
        }
        35% { opacity: 0.5; }
        100% {
          opacity: 0;
          transform: scale(1.75);
        }
      }

      #receiver-status {
        position: fixed;
        left: 50%;
        bottom: 10vh;
        max-width: min(680px, 72vw);
        padding: 0.75em 1.1em;
        border-left: 4px solid #20c5c9;
        border-radius: 4px;
        background: rgba(13, 24, 32, 0.94);
        color: #f4f8fa;
        font: 600 20px/1.3 'Inter', Arial, sans-serif;
        opacity: 0;
        transform: translate(-50%, 10px);
        transition: opacity 260ms cubic-bezier(0.22, 1, 0.36, 1),
          transform 260ms cubic-bezier(0.22, 1, 0.36, 1);
        pointer-events: none;
        z-index: 10;
      }

      #receiver-status.visible {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      #receiver-status.error {
        border-left-color: #ff6b6b;
      }

      .receiver-layer {
        position: fixed;
        inset: 0;
        z-index: 18;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 320ms cubic-bezier(0.22, 1, 0.36, 1),
          visibility 0s linear 320ms;
      }

      .receiver-layer.visible {
        opacity: 1;
        visibility: visible;
        transition-delay: 0s;
      }

      #receiver-transition {
        z-index: 22;
        display: none;
      }

      #receiver-transition-content {
        position: absolute;
        left: 5vw;
        bottom: 11vh;
        display: flex;
        align-items: center;
        min-width: min(500px, 62vw);
        max-width: 72vw;
        padding: 0;
        background: transparent;
        box-sizing: border-box;
        filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.82));
        transform: translateY(14px);
        transition: transform 320ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      #receiver-transition.visible #receiver-transition-content {
        transform: translateY(0);
      }

      #receiver-transition-artwork {
        flex: 0 0 auto;
        width: 78px;
        height: 78px;
        margin-right: 18px;
        border-radius: 4px;
        background: transparent;
        object-fit: contain;
      }

      #receiver-transition-copy,
      #receiver-end-copy {
        min-width: 0;
      }

      #receiver-transition-title,
      #receiver-end-title {
        margin: 0;
        overflow: hidden;
        color: #f7fafb;
        font: 650 28px/1.18 'Inter', Arial, sans-serif;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #receiver-transition-meta,
      #receiver-end-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 8px;
        color: rgba(247, 250, 251, 0.72);
        font: 500 16px/1.3 'Inter', Arial, sans-serif;
      }

      .receiver-badge {
        display: inline-flex;
        align-items: center;
        min-height: 26px;
        padding: 0 9px;
        border-radius: 4px;
        background: #20c5c9;
        color: #071015;
        font: 750 13px/26px 'Inter', Arial, sans-serif;
        text-transform: uppercase;
      }

      #receiver-pause {
        z-index: 19;
        background:
          linear-gradient(180deg, rgba(0, 0, 0, 0.72) 0, transparent 34%),
          linear-gradient(0deg, rgba(0, 0, 0, 0.94) 0, rgba(0, 0, 0, 0.62) 34%, transparent 58%);
      }

      #receiver-pause-content {
        position: absolute;
        left: 5vw;
        right: 5vw;
        bottom: clamp(72px, 8vh, 96px);
      }

      #receiver-pause-logo {
        position: absolute;
        top: 5vh;
        left: 5vw;
        width: min(152px, 20vw);
        height: auto;
      }

      #receiver-pause-heading {
        position: absolute;
        top: 5vh;
        left: 23vw;
        right: 23vw;
        text-align: center;
      }

      #receiver-pause-artwork {
        position: absolute;
        top: 4.5vh;
        right: 5vw;
        width: 76px;
        height: 108px;
        border-radius: 4px;
        object-fit: cover;
        filter: drop-shadow(0 5px 18px rgba(0, 0, 0, 0.48));
      }

      #receiver-pause-artwork.channel {
        width: 82px;
        height: 82px;
        object-fit: contain;
      }

      #receiver-pause-artwork[hidden] {
        display: none;
      }

      #receiver-pause-label {
        margin-top: 6px;
        color: rgba(247, 250, 251, 0.68);
        font: 500 15px/1.25 'Inter', Arial, sans-serif;
      }

      #receiver-pause-title {
        margin: 0;
        overflow: hidden;
        color: #f7fafb;
        font: 650 24px/1.2 'Inter', Arial, sans-serif;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #receiver-pause-meta {
        display: none;
      }

      #receiver-pause-timeline {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 16px;
      }

      #receiver-pause-progress {
        position: relative;
        width: 100%;
        height: 4px;
        background: rgba(255, 255, 255, 0.24);
      }

      #receiver-pause-progress::after {
        content: '';
        position: absolute;
        top: 50%;
        left: var(--progress, 0%);
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #f7fafb;
        box-shadow: 0 0 0 4px rgba(247, 250, 251, 0.12);
        transform: translate(-50%, -50%);
        transition: background 150ms ease, box-shadow 150ms ease;
      }

      #receiver-pause-progress-fill {
        width: 0;
        height: 100%;
        background: rgba(247, 250, 251, 0.94);
        transition: width 90ms linear, background 150ms ease;
      }

      #receiver-pause-timeline.scrubbing #receiver-pause-progress-fill {
        transition: none;
      }

      #receiver-pause-time,
      #receiver-pause-duration {
        min-width: 66px;
        color: #f7fafb;
        font: 600 14px/1.2 'Inter', Arial, sans-serif;
        white-space: nowrap;
      }

      #receiver-pause-duration {
        text-align: right;
      }

      #receiver-pause-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: clamp(28px, 3vw, 58px);
        margin-top: clamp(18px, 2.5vh, 28px);
      }

      .receiver-control-group {
        display: flex;
        align-items: center;
        gap: clamp(20px, 1.3vw, 25px);
      }

      .receiver-control {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: clamp(56px, 4.43vw, 85px);
        height: clamp(56px, 4.43vw, 85px);
        border: 2px solid transparent;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.14);
        box-sizing: border-box;
        transition: border-color 150ms ease, background 150ms ease,
          transform 150ms ease;
      }

      .receiver-control.primary {
        width: clamp(56px, 4.43vw, 85px);
        height: clamp(56px, 4.43vw, 85px);
        background: rgba(255, 255, 255, 0.14);
      }

      .receiver-control.option {
        width: clamp(56px, 4.43vw, 85px);
        min-width: clamp(56px, 4.43vw, 85px);
        padding: 0;
        border-radius: 50%;
      }

      .receiver-control.focused {
        border-color: transparent;
        background: #20c5c9;
        transform: scale(1.08);
      }

      .receiver-control.primary.focused {
        border-color: transparent;
        background: #20c5c9;
      }

      .receiver-control-caption {
        position: absolute;
        top: calc(100% + 6px);
        left: 50%;
        width: 132px;
        min-height: 28px;
        color: #f7fafb;
        font: 600 clamp(11px, 0.72vw, 13px)/1.15 'Inter', Arial, sans-serif;
        opacity: 0;
        text-align: center;
        transform: translateX(-50%);
        transition: opacity 150ms ease;
        white-space: pre-line;
      }

      .receiver-control.focused .receiver-control-caption {
        opacity: 1;
      }

      .receiver-control img {
        width: 46%;
        height: 46%;
        object-fit: contain;
      }

      .receiver-control.primary img {
        width: 48%;
        height: 48%;
      }

      #receiver-pause-timeline.focused #receiver-pause-progress {
        height: 6px;
        background: rgba(255, 255, 255, 0.36);
        box-shadow: 0 0 0 3px rgba(32, 197, 201, 0.1);
      }

      #receiver-pause-timeline.focused #receiver-pause-progress-fill {
        background: #20c5c9;
      }

      #receiver-pause-timeline.focused #receiver-pause-progress::after {
        background: #20c5c9;
        box-shadow: 0 0 0 4px rgba(32, 197, 201, 0.16);
      }

      #receiver-options {
        position: fixed;
        top: 0;
        right: 0;
        z-index: 34;
        display: flex;
        width: clamp(320px, 35vw, 510px);
        height: 100%;
        padding: 56px 30px 34px;
        overflow: hidden;
        border-left: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(27, 29, 30, 0.98);
        box-sizing: border-box;
        flex-direction: column;
        opacity: 0;
        visibility: hidden;
        transform: translateX(24px);
        transition: opacity 220ms cubic-bezier(0.22, 1, 0.36, 1),
          transform 220ms cubic-bezier(0.22, 1, 0.36, 1),
          visibility 0s linear 220ms;
      }

      #receiver-options.visible {
        opacity: 1;
        visibility: visible;
        transform: translateX(0);
        transition-delay: 0s;
      }

      #receiver-options-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 42px;
        margin-bottom: 28px;
      }

      #receiver-options-title {
        margin: 0;
        color: #f7fafb;
        font: 650 23px/1.2 'Inter', Arial, sans-serif;
        letter-spacing: 0;
      }

      #receiver-options-close {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        border: 2px solid transparent;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.28);
        box-sizing: border-box;
        color: #fff;
        font: 300 31px/1 'Inter', Arial, sans-serif;
        transition: background 150ms ease, border-color 150ms ease,
          transform 150ms ease;
      }

      #receiver-options-close.focused {
        border-color: #20c5c9;
        background: rgba(32, 197, 201, 0.22);
        transform: scale(1.08);
      }

      #receiver-options-list {
        display: flex;
        min-height: 0;
        overflow-x: hidden;
        overflow-y: auto;
        flex-direction: column;
        gap: 6px;
        scrollbar-width: none;
      }

      #receiver-options-list::-webkit-scrollbar {
        display: none;
      }

      .receiver-option-row {
        display: flex;
        align-items: center;
        min-height: 52px;
        padding: 0 14px;
        border: 2px solid transparent;
        border-radius: 4px;
        box-sizing: border-box;
        color: rgba(247, 250, 251, 0.84);
        font: 560 16px/1.2 'Inter', Arial, sans-serif;
        letter-spacing: 0;
      }

      .receiver-option-label {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .receiver-option-check {
        position: relative;
        flex: 0 0 auto;
        width: 22px;
        height: 22px;
        margin-left: auto;
        border: 2px solid rgba(255, 255, 255, 0.22);
        border-radius: 50%;
        box-sizing: border-box;
        opacity: 0;
        transform: scale(0.82);
        transition: opacity 140ms ease, transform 140ms ease;
      }

      .receiver-option-row.active {
        color: #20c5c9;
      }

      .receiver-option-row.active .receiver-option-check {
        border-color: #20c5c9;
        background: #20c5c9;
        opacity: 1;
        transform: scale(1);
      }

      .receiver-option-row.active .receiver-option-check::after {
        content: '';
        position: absolute;
        top: 5px;
        left: 4px;
        width: 9px;
        height: 5px;
        border-bottom: 2px solid #071015;
        border-left: 2px solid #071015;
        transform: rotate(-45deg);
      }

      .receiver-option-row.focused {
        border-color: #20c5c9;
        background: rgba(32, 197, 201, 0.14);
        color: #f7fafb;
      }

      .receiver-option-row.group {
        min-height: 38px;
        margin-top: 10px;
        padding: 0 4px;
        color: rgba(247, 250, 251, 0.52);
        font-size: 13px;
        font-weight: 650;
        text-transform: uppercase;
      }

      .receiver-option-row.group:first-child {
        margin-top: 0;
      }

      .receiver-option-swatch {
        width: 22px;
        height: 22px;
        margin-right: 12px;
        border: 1px solid rgba(255, 255, 255, 0.38);
        border-radius: 50%;
        box-sizing: border-box;
      }

      #receiver-seek-preview {
        position: fixed;
        left: 50%;
        bottom: max(172px, 22vh);
        z-index: 32;
        display: flex;
        flex-direction: column;
        align-items: center;
        contain: layout paint style;
        opacity: 0;
        visibility: hidden;
        transform: translate(-50%, 10px);
        transition: opacity 180ms ease, transform 180ms ease,
          visibility 0s linear 180ms;
        will-change: left, opacity, transform;
        pointer-events: none;
      }

      #receiver-seek-preview.visible {
        opacity: 1;
        visibility: visible;
        transform: translate(-50%, 0);
        transition-delay: 0s;
      }

      #receiver-seek-frame {
        position: relative;
        width: 208px;
        height: 117px;
        overflow: hidden;
        border: 2px solid rgba(255, 255, 255, 0.86);
        border-radius: 4px;
        background: #071015;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.38);
      }

      #receiver-seek-frame[hidden] {
        display: none;
      }

      #receiver-seek-image {
        position: absolute;
        display: none;
        max-width: none;
        transform-origin: top left;
      }

      #receiver-seek-time {
        min-width: 76px;
        margin-top: 8px;
        padding: 6px 10px;
        border-radius: 4px;
        background: rgba(7, 16, 21, 0.9);
        color: #fff;
        font: 650 15px/1.2 'Inter', Arial, sans-serif;
        text-align: center;
      }

      #receiver-error,
      #receiver-end {
        z-index: 35;
        background: #000;
      }

      #receiver-error-content,
      #receiver-end-content {
        position: absolute;
        top: 50%;
        left: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(720px, 78vw);
        text-align: center;
        transform: translate(-50%, -50%);
      }

      #receiver-error-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 54px;
        height: 54px;
        margin-bottom: 22px;
        border: 2px solid #ff6b6b;
        border-radius: 50%;
        color: #ff6b6b;
        font: 750 30px/1 'Inter', Arial, sans-serif;
      }

      #receiver-error-title {
        margin: 0;
        color: #f7fafb;
        font: 650 30px/1.2 'Inter', Arial, sans-serif;
      }

      #receiver-error-message {
        margin: 10px 0 0;
        color: rgba(247, 250, 251, 0.68);
        font: 450 18px/1.45 'Inter', Arial, sans-serif;
      }

      #receiver-error-code {
        margin-top: 20px;
        color: rgba(247, 250, 251, 0.42);
        font: 500 13px/1.2 'Inter', Arial, sans-serif;
      }

      #receiver-end-artwork {
        width: 152px;
        height: 152px;
        margin-bottom: 24px;
        border-radius: 4px;
        background: transparent;
        object-fit: contain;
      }

      #receiver-end-meta {
        justify-content: center;
      }

      @media (max-width: 960px), (max-height: 600px) {
        #receiver-transition-title,
        #receiver-end-title {
          font-size: 24px;
        }

        #receiver-pause-title {
          font-size: 20px;
        }

        #receiver-transition-artwork {
          width: 64px;
          height: 64px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
