<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SWEET Cast Lab Receiver</title>
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <style>
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('assets/fonts/inter-regular.ttf') format('truetype');
      }

      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url('assets/fonts/inter-semibold.ttf') format('truetype');
      }

      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('assets/fonts/inter-bold.ttf') format('truetype');
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: 'Inter', Arial, sans-serif;
        /* This removes the default CAF playback watermark over video. */
        --playback-logo-image: none;
      }

      cast-media-player {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        --background: #000;
        --background-color: #000;
        --background-image: none;
        /* CAF shows this mark only in its controls/idle UI, never over video. */
        --logo-background: transparent;
        --logo-color: transparent;
        --logo-image: url('assets/sweet-tv-logo-light.svg');
        --logo-size: 360px auto;
        --splash-background: #000;
        --splash-color: #000;
        --splash-image: url('assets/sweet-tv-logo-light.svg');
        --splash-size: 360px auto;
        --font-family: 'Inter', Arial, sans-serif;
        --theme-hue: 185;
        --progress-color: #20c5c9;
        --break-color: #20c5c9;
      }

      #receiver-loader {
        position: fixed;
        inset: 0;
        z-index: 20;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        will-change: opacity;
        transition: opacity 320ms cubic-bezier(0.22, 1, 0.36, 1),
          visibility 320ms linear;
      }

      #receiver-loader.visible {
        opacity: 1;
        visibility: visible;
      }

      #receiver-loader-logo {
        position: absolute;
        top: 5vh;
        left: 5vw;
        width: min(152px, 20vw);
        height: auto;
        transform: translateY(-8px);
        transition: transform 320ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      #receiver-loader-activity {
        position: absolute;
        top: 7vh;
        left: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        max-width: 76vw;
        transform: translate(-50%, -14px);
        transition: transform 320ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      #receiver-loader.visible #receiver-loader-logo {
        transform: translateY(0);
      }

      #receiver-loader.visible #receiver-loader-activity {
        transform: translate(-50%, 0);
      }

      .receiver-loader-spinner {
        width: 28px;
        height: 28px;
        box-sizing: border-box;
        border: 3px solid rgba(32, 197, 201, 0.25);
        border-top-color: #20c5c9;
        border-radius: 50%;
        animation: sweet-loader-spin 820ms linear infinite;
      }

      #receiver-loader-label {
        min-height: 22px;
        color: #f3f8f9;
        font-size: 18px;
        font-weight: 600;
        line-height: 1.3;
        letter-spacing: 0;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
        white-space: nowrap;
      }

      @keyframes sweet-loader-spin {
        to { transform: rotate(360deg); }
      }

      #receiver-status {
        position: fixed;
        left: 50%;
        bottom: 10vh;
        max-width: min(680px, 72vw);
        padding: 0.75em 1.1em;
        border-left: 4px solid #20c5c9;
        border-radius: 4px;
        background: rgba(13, 24, 32, 0.94);
        color: #f4f8fa;
        font: 600 20px/1.3 'Inter', Arial, sans-serif;
        opacity: 0;
        transform: translate(-50%, 10px);
        transition: opacity 260ms cubic-bezier(0.22, 1, 0.36, 1),
          transform 260ms cubic-bezier(0.22, 1, 0.36, 1);
        pointer-events: none;
        z-index: 10;
      }

      #receiver-status.visible {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      #receiver-status.error {
        border-left-color: #ff6b6b;
      }
    </style>
    <script defer src="receiver.js?v=receiver-loader-layout-1"></script>
  </head>
  <body>
    <cast-media-player></cast-media-player>
    <div id="receiver-loader" class="visible" aria-hidden="true">
      <img id="receiver-loader-logo" src="assets/sweet-tv-logo-light.svg" alt="SWEET.TV">
      <div id="receiver-loader-activity">
        <div class="receiver-loader-spinner"></div>
        <div id="receiver-loader-label"></div>
      </div>
    </div>
    <div id="receiver-status" role="status" aria-live="polite"></div>
  </body>
</html>
